<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3. Text Preprocessing and Cleaning</title>

<script>
const $=s=>document.querySelector(s);
const C={a:'#3b82c4',g:'#2e9e6b',o:'#d9822b',p:'#8a5cc4',r:'#c4423b',y:'#b8921a',k:'#667'};
const STOP=new Set('a an the is are was were be been to of in on at for and or but it its this that i me my we you he she they them with as by from do does did will can so'.split(' '));
const tok=t=>t.match(/[A-Za-z']+|\d+|[^\sA-Za-z\d]/g)||[];
const words=t=>tok(t).filter(w=>/^[A-Za-z']+$/.test(w));
const ch=(a,c)=>a.map(x=>[x,c]);
const stem=w=>w.length>4?w.replace(/(ing|edly|ed|ies|es|s|ly)$/,m=>m=='ies'?'y':'').replace(/(.)\1$/,'$1'):w;
const LM={children:'child',running:'run',playing:'play',buying:'buy',went:'go',better:'good',studies:'study',mice:'mouse',was:'be',loves:'love',movies:'movie',eating:'eat',tastier:'tasty'};
const lem=w=>LM[w]||(w.length>3&&w.endsWith('s')&&!w.endsWith('ss')?w.slice(0,-1):w);
const cos=(a,b)=>{let d=0,x=0,y=0;a.forEach((v,i)=>{d+=v*b[i];x+=v*v;y+=b[i]*b[i]});return x&&y?d/Math.sqrt(x*y):0};

const SMP=['The children were running and playing in the gardens, buying flights!!','She studies better and went to buy movies','Mice were eating the tastier apples'];
const S=[
{n:'Raw\ntext',f:c=>({o:'Raw text has capitals, punctuation and filler words that add noise.',c:[[c.text,C.a]]})},
{n:'Lower +\npunct.',f:c=>{c.l=c.text.toLowerCase().replace(/[^a-z\s']/g,'').split(/\s+/).filter(Boolean);return{o:'Lowercased and punctuation removed, so "The" and "the" now match.',c:ch(c.l,C.a)}}},
{n:'Stop\nwords',f:c=>{c.k=c.l.filter(x=>!STOP.has(x));return{o:'Red = stop words removed (very common, little meaning). '+c.k.length+' words kept.',c:c.l.map(x=>[x,STOP.has(x)?C.r:C.g])}}},
{n:'Stemming',f:c=>({o:'Stemming chops suffixes by rule. Fast, but can give non-words (apples > appl).',c:c.k.map(x=>[x+'>'+stem(x),C.o])})},
{n:'Lemma-\ntization',f:c=>({o:'Lemmatization uses a dictionary to return the real base word (better > good, mice > mouse).',c:c.k.map(x=>[x+'>'+lem(x),C.p])})}];
const px=i=>-3.6+i*(S.length>1?7.2/(S.length-1):0);
const ST=S.map((s,i)=>{const e=document.createElement('a-box'),t=document.createElement('a-text');
 e.setAttribute('position',px(i)+' 3 0');e.setAttribute('width',1.55);e.setAttribute('height',.8);e.setAttribute('depth',.2);e.setAttribute('color','#2a6db0');
 t.setAttribute('value',s.n);t.setAttribute('align','center');t.setAttribute('position','0 0 .11');t.setAttribute('width',1.7);t.setAttribute('wrap-count',12);t.setAttribute('color','#fff');
 e.appendChild(t);$('#w').appendChild(e);return e});
const CP=[...document.querySelectorAll('.cp')];
function chips(a){let x=-4.1,r=0;CP.forEach(b=>b.setAttribute('visible',false));
 for(let i=0;i<a.length&&i<CP.length;i++){const[t,c]=a[i],s=String(t),w=s.length*.14+.3;
  if(x+w>4.1){x=-4.1;r++}if(r>1)break;
  const b=CP[i];b.setAttribute('visible',true);b.setAttribute('width',w);b.setAttribute('color',c);b.setAttribute('position',(x+w/2)+' '+(2.30-r*.40)+' 0');
  b.firstElementChild.setAttribute('text',{value:s,width:s.length*.14+.14,wrapCount:s.length+1,align:'center',color:'#fff'});x+=w+.12}}
let ctx,k=-1,si=0,tm=[];
function rst(){tm.forEach(clearTimeout);tm=[];k=-1;ctx={text:SMP[si]};ST.forEach(s=>s.setAttribute('color','#2a6db0'));
 $('#pk').setAttribute('animation','property:position;to:'+px(0)+' 3.65 0;dur:300');
 $('#out').setAttribute('value','Sample text '+(si+1)+' of '+SMP.length+':\n'+SMP[si]+'\n\nPress Step (one stage at a time) or Run all.');chips([])}
function step(){if(k>=S.length-1)return;const kk=++k;
 ST.forEach((s,i)=>s.setAttribute('color',i<kk?'#2e9e6b':i==kk?'#f90':'#2a6db0'));
 $('#pk').setAttribute('animation','property:position;to:'+px(kk)+' 3.65 0;dur:600;easing:easeInOutQuad');
 const r=S[kk].f(ctx);tm.push(setTimeout(()=>{$('#out').setAttribute('value',(kk+1)+'. '+S[kk].n.replace('\n',' ')+'\n'+r.o);chips(r.c||[])},600))}
const act={run:()=>{rst();S.forEach((_,i)=>tm.push(setTimeout(step,i*2800+300)))},step,rst,nxt:()=>{si=(si+1)%SMP.length;rst()}};
document.querySelectorAll('.btn').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.a=='step')tm.forEach(clearTimeout);act[b.dataset.a]()}));
rst();
</script></body></html>
