<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>5. Named Entity Recognition (NER)</title>

<a-box class="cp" visible="false" height=".36" depth=".08" color="#555"><a-text align="center" position="0 0 .06" color="#fff" value=" "></a-text></a-box><a-box class="cp" visible="false" height=".36" depth=".08" color="#555"><a-text align="center" position="0 0 .06" color="#fff" value=" "></a-text></a-box><a-box class="cp" visible="false" height=".36" depth=".08" color="#555"><a-text align="center" position="0 0 .06" color="#fff" value=" "></a-text></a-box><a-box class="cp" visible="false" height=".36" depth=".08" color="#555"><a-text align="center" position="0 0 .06" color="#fff" value=" "></a-text></a-box><a-box class="cp" visible="false" height=".36" depth=".08" color="#555"><a-text align="center" position="0 0 .06" color="#fff" value=" "></a-text></a-box><a-box class="cp" visible="false" height=".36" depth=".08" color="#555"><a-text align="center" position="0 0 .06" color="#fff" value=" "></a-text></a-box><a-box class="cp" visible="false" height=".36" depth=".08" color="#555"><a-text align="center" position="0 0 .06" color="#fff" value=" "></a-text></a-box><a-box class="cp" visible="false" height=".36" depth=".08" color="#555"><a-text align="center" position="0 0 .06" color="#fff" value=" "></a-text></a-box><a-box class="cp" visible="false" height=".36" depth=".08" color="#555"><a-text align="center" position="0 0 .06" color="#fff" value=" "></a-text></a-box><a-box class="cp" visible="false" height=".36" depth=".08" color="#555"><a-text align="center" position="0 0 .06" color="#fff" value=" "></a-text></a-box><a-box class="cp" visible="false" height=".36" depth=".08" color="#555"><a-text align="center" position="0 0 .06" color="#fff" value=" "></a-text></a-box><a-box class="cp" visible="false" height=".36" depth=".08" color="#555"><a-text align="center" position="0 0 .06" color="#fff" value=" "></a-text></a-box><a-box class="cp" visible="false" height=".36" depth=".08" color="#555"><a-text align="center" position="0 0 .06" color="#fff" value=" "></a-text></a-bo p-count="14" color="#fff"></a-text></a-box><a-box class="btn" data-a="nxt" position="3.15 0 0" width="1.9" height=".5" depth=".1" color="#d9822b"><a-text value="Next text" align="center" position="0 0 .06" width="2.4" wrap-count="14" color="#fff"></a-text></a-box>
</a-entity></a-scene>
<script>
const $=s=>document.querySelector(s);
const C={a:'#3b82c4',g:'#2e9e6b',o:'#d9822b',p:'#8a5cc4',r:'#c4423b',y:'#b8921a',k:'#667'};
const STOP=new Set('a an the is are was were be been to of in on at for and or but it its this that i me my we you he she they them with as by from do does did will can so'.split(' '));
const tok=t=>t.match(/[A-Za-z']+|\d+|[^\sA-Za-z\d]/g)||[];
const words=t=>tok(t).filter(w=>/^[A-Za-z']+$/.test(w));
const ch=(a,c)=>a.map(x=>[x,c]);
const stem=w=>w.length>4?w.replace(/(ing|edly|ed|ies|es|s|ly)$/,m=>m=='ies'?'y':'').replace(/(.)\1$/,'$1'):w;
const LM={children:'child',running:'run',playing:'play',buying:'buy',went:'go',better:'good',studies:'study',mice:'mouse',was:'be',loves:'love',movies:'movie',eating:'eat',tastier:'tasty'};
const lem=w=>LM[w]||(w.length>3&&w.endsWith('s')&&!w.endsWith('ss')?w.slice(0,-1):w);
const cos=(a,b)=>{let d=0,x=0,y=0;a.forEach((v,i)=>{d+=v*b[i];x+=v*v;y+=b[i]*b[i]});return x&&y?d/Math.sqrt(x*y):0};

const SMP=['Sundar Pichai met Google teams in Mumbai on 12 March 2026.','Priya joined Infosys in Pune and earns Rs 60,000.','The Reserve Bank of India announced new rules in Delhi on 5 June.'];
const G=[['Sundar Pichai','PERSON'],['Priya','PERSON'],['Rahul','PERSON'],['Mumbai','LOCATION'],['Delhi','LOCATION'],['Pune','LOCATION'],['India','LOCATION'],['Google','ORG'],['Infosys','ORG'],['Barclays','ORG'],['Reserve Bank of India','ORG']];
const EC={PERSON:C.p,LOCATION:C.g,ORG:C.o,DATE:C.y,MONEY:C.r};
const cl=e=>e.filter(a=>!e.some(b=>b!==a&&b[2]<=a[2]&&b[2]+b[0].length>=a[2]+a[0].length&&b[0].length>a[0].length));
const ec=c=>c.e.slice().sort((a,b)=>a[2]-b[2]).map(e=>[e[0]+' : '+e[1],EC[e[1]]]);
const S=[
{n:'Raw\ntext',f:c=>({o:'Goal: find real-world things (people, places, organisations, dates, money) in the text.',c:[[c.text,C.a]]})},
{n:'Tokens',f:c=>({o:'Step 1: tokenize. Capitalised words are candidate names.',c:ch(tok(c.text).filter(x=>/\w/.test(x)),C.a)})},
{n:'Gazetteer\nlookup',f:c=>{c.e=[];G.forEach(([n,t])=>{const i=c.text.indexOf(n);if(i>=0)c.e.push([n,t,i])});c.e=cl(c.e);return{o:'Known names are matched against a list (gazetteer) of people, places and companies.',c:ec(c)}}},
{n:'Pattern\nrules',f:c=>{[[/\d{1,2} (?:January|February|March|April|May|June|July|August|September|October|November|December)(?: \d{4})?/g,'DATE'],[/(?:Rs\.?|INR|\$)\s?[\d,]*\d/g,'MONEY']].forEach(([r,t])=>{for(const m of c.text.matchAll(r))c.e.push([m[0],t,m.index])});return{o:'Regex patterns catch dates and money, which no list can contain.',c:ec(c)}}},
{n:'Entities',f:c=>{let s=c.text;c.e.slice().sort((a,b)=>b[2]-a[2]).forEach(([n,t,i])=>{s=s.slice(0,i)+'['+n+' | '+t+']'+s.slice(i+n.length)});return{o:'Labelled output:\n'+s,c:ec(c)}}}];
const px=i=>-3.6+i*(S.length>1?7.2/(S.length-1):0);
const ST=S.map((s,i)=>{const e=document.createElement('a-box'),t=document.createElement('a-text');
 e.setAttribute('position',px(i)+' 3 0');e.setAttribute('width',1.55);e.setAttribute('height',.8);e.setAttribute('depth',.2);e.setAttribute('color','#2a6db0');
 t.setAttribute('value',s.n);t.setAttribute('align','center');t.setAttribute('position','0 0 .11');t.setAttribute('width',1.7);t.setAttribute('wrap-count',12);t.setAttribute('color','#fff');
 e.appendChild(t);$('#w').appendChild(e);return e});
const CP=[...document.querySelectorAll('.cp')];
function chips(a){let x=-4.1,r=0;CP.forEach(b=>b.setAttribute('visible',false));
 for(let i=0;i<a.length&&i<CP.length;i++){const[t,c]=a[i],s=String(t),w=s.length*.14+.3;
  if(x+w>4.1){x=-4.1;r++}if(r>1)break;
  const b=CP[i];b.setAttribute('visible',true);b.setAttribute('width',w);b.setAttribute('color',c);b.setAttribute('position',(x+w/2)+' '+(2.25-r*.45)+' 0');
  b.firstElementChild.setAttribute('text',{value:s,width:s.length*.14+.14,wrapCount:s.length+1,align:'center',color:'#fff'});x+=w+.12}}
let ctx,k=-1,si=0,tm=[];
function rst(){tm.forEach(clearTimeout);tm=[];k=-1;ctx={text:SMP[si]};ST.forEach(s=>s.setAttribute('color','#2a6db0'));
 $('#pk').setAttribute('animation','property:position;to:'+px(0)+' 3.65 0;dur:300');
 $('#out').setAttribute('value','Sample text '+(si+1)+' of '+SMP.length+':\n'+SMP[si]+'\n\nPress Step (one stage at a time) or Run all.');chips([])}
function step(){if(k>=S.length-1)return;const kk=++k;
 ST.forEach((s,i)=>s.setAttribute('color',i<kk?'#2e9e6b':i==kk?'#f90':'#2a6db0'));
 $('#pk').setAttribute('animation','property:position;to:'+px(kk)+' 3.65 0;dur:600;easing:easeInOutQuad');
 const r=S[kk].f(ctx);tm.push(setTimeout(()=>{$('#out').setAttribute('value',(kk+1)+'. '+S[kk].n.replace('\n',' ')+'\n'+r.o);chips(r.c||[])},600))}
const act={run:()=>{rst();S.forEach((_,i)=>tm.push(setTimeout(step,i*2800+300)))},step,rst,nxt:()=>{si=(si+1)%SMP.length;rst()}};
document.querySelectorAll('.btn').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.a=='step')tm.forEach(clearTimeout);act[b.dataset.a]()}));
rst();
</script></body></html>
