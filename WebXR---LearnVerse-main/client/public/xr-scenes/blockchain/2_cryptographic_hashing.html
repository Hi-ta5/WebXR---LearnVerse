<script>
const $=s=>document.querySelector(s),T=(s,v)=>$(s).setAttribute('value',v);
const hx=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(16).padStart(8,'0')};
const pc=n=>n.toString(2).split('1').length-1;
let si=-1,busy=0,tm=[];

const MS=['Alice pays Bob 10','Bob pays Carol 25','Blockchain'];let mi=0,cur,A;
const alt=t=>t.slice(0,-1)+String.fromCharCode(t.charCodeAt(t.length-1)+1);
function row(r,h,ref){for(let k=0;k<8;k++){T('#c'+r+k,h?h[k]:' ');$('#h'+r+k).setAttribute('color',!h?'#334':ref?(ref[k]!=h[k]?'#c4423b':'#2e9e6b'):'#2a6db0')}}
const ban=(t,c)=>{T('#ban',t);$('#ban').setAttribute('color',c||'#fff')};
const spin=()=>$('#gear').emit('spin');
const diff=B=>pc((parseInt(A,16)^parseInt(B,16))>>>0);
const INTRO=['HASH = A FINGERPRINT FOR DATA','A hash function turns any data into a short code, like a fingerprint.','a fingerprint: same finger, same print.','Press Next step.'];
function rst0(){cur=MS[mi];A='';T('#inp',cur);row(0,'');row(1,'');ban('')}
const X={msg:()=>{mi=(mi+1)%3;ACT.rst()},flip:()=>{if(!A)return;const t=alt(cur),B=hx(t);T('#inp',t);spin();row(1,B,A);ban(diff(B)+' of 32 bits changed','#ff8a80');T('#inf','Changed the last letter. The new fingerprint is completely different (red tiles).')}};
const STEPS=[
{t:'Pick some data',a:'putting a finger on a scanner.',h:'Click New text to change it.',f:()=>'We will hash: "'+cur+'". Any data can go in, small or big.'},
{t:'Make the fingerprint',a:'a fingerprint cannot rebuild the finger.',h:'Press Next step.',f:()=>{A=hx(cur);spin();row(0,A);return 'The machine outputs a short code: '+A+'. You cannot work backwards from it to the data.'}},
{t:'Do it again',a:'same finger, same print.',h:'Press Next step.',f:()=>{row(1,hx(cur),A);ban('SAME fingerprint','#9bffb0');return 'Same data always gives the same fingerprint (all green). That is how anyone can double-check data.'}},
{t:'Change one letter',a:'a different finger gives a different print.',h:'Click Flip char.',f:()=>{const t=alt(cur),B=hx(t);T('#inp',t);spin();row(1,B,A);ban(diff(B)+' of 32 bits changed','#ff8a80');return 'One letter changed, but the fingerprint is totally different (red tiles). Tampering is easy to spot.'}},
{t:'Always same size',a:'a word and a whole book each get one print.',h:'Press Reset to replay.',f:()=>{T('#inp','(same text x30)');spin();row(1,hx(cur.repeat(30)),A);ban('Still 8 digits','#fff');return 'Even huge data gives a fingerprint of the same length (8 digits here; SHA-256 uses 64).'}}];
function dots(){for(let i=0;i<STEPS.length;i++)$('#d'+i).setAttribute('color',i<si?'#2e9e6b':i==si?'#f90':'#555')}
function go(i){if(busy)return;si=i;const s=STEPS[i];T('#ttl','Step '+(i+1)+'/'+STEPS.length+': '+s.t);T('#inf',s.f()||'');T('#ana','Think of it like: '+(s.a||''));T('#hnt','Try this: '+(s.h||'Press Next step'));dots()}
const ACT=Object.assign({
 next:()=>{if(si<STEPS.length-1)go(si+1)},
 run:()=>{ACT.rst();const n=()=>{if(si>=STEPS.length-1)return;if(busy){tm.push(setTimeout(n,300));return}go(si+1);tm.push(setTimeout(n,STEPS[si].w||3600))};n()},
 rst:()=>{tm.forEach(clearTimeout);tm=[];busy=0;si=-1;rst0();T('#ttl',INTRO[0]);T('#inf',INTRO[1]);T('#ana',INTRO[2]);T('#hnt',INTRO[3]);dots()}},X);
document.querySelectorAll('.btn,.hit').forEach(b=>b.addEventListener('click',()=>{const f=ACT[b.dataset.a];if(f)f(b.dataset.v)}));
ACT.rst();
</script></body></html>
