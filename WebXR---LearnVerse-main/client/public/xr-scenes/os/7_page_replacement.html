<script>
const $=s=>document.querySelector(s),T=(s,v)=>$(s).setAttribute('value',v);
const hx=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(16).padStart(8,'0')};
const pc=n=>n.toString(2).split('1').length-1;
let si=-1,busy=0,tm=[];
const at=(ms,f)=>tm.push(setTimeout(f,ms)),hold=ms=>{busy=1;at(ms,()=>busy=0)};
const vs=(a,v)=>a.forEach(i=>$('#'+i).setAttribute('visible',v));

const REF=[7,0,1,2,0,3,0,4,2,3,0,3],NM={fifo:'FIFO: remove the OLDEST page',lru:'LRU: remove the page unused for the LONGEST time'};
function simR(a){const fr=[],ord=[],last={},out=[];let f=0;REF.forEach((p,t)=>{const hit=fr.includes(p);let ev=null;if(!hit){f++;if(fr.length<3){fr.push(p);ord.push(p)}else{let v;if(a=='fifo')v=ord.shift();else v=fr.reduce((x,y)=>last[x]<last[y]?x:y);ev=v;fr[fr.indexOf(v)]=p;if(a=='fifo')ord.push(p)}}last[p]=t;out.push({fr:fr.slice(),hit,ev,f})});return out}
function clr(){for(let i=0;i<12;i++){T('#rt'+i,String(REF[i]));$('#rf'+i).setAttribute('color','#2a6db0');$('#tq'+i).setAttribute('color','#445')}for(let k=0;k<3;k++){T('#ft'+k,'-');$('#fr'+k).setAttribute('color','#334')}T('#fc','faults: 0');T('#sts','')}
function paint(r,t){for(let i=0;i<12;i++)$('#rf'+i).setAttribute('color',i==t?'#f90':i<t?'#2e5a8a':'#2a6db0');const p=REF[t],idx=r.fr.indexOf(p);for(let k=0;k<3;k++){T('#ft'+k,r.fr[k]==null?'-':String(r.fr[k]));$('#fr'+k).setAttribute('color',k==idx?(r.hit?'#2e9e6b':'#d4a017'):'#334')}
 $('#tq'+t).setAttribute('color',r.hit?'#2e9e6b':'#c4423b');T('#fc','faults: '+r.f);T('#sts',r.hit?'HIT\npage '+p+' is there':'PAGE FAULT\n'+(r.ev!=null?'evict '+r.ev+', load '+p:'load '+p));$('#sts').setAttribute('color',r.hit?'#9bffb0':'#ff8a80')}
function play(a,msg){clr();T('#alg',NM[a]);busy=1;const R=simR(a);R.forEach((r,t)=>at(t*800,()=>paint(r,t)));at(12*800,()=>{busy=0;T('#inf',msg(R[11].f))})}
const INTRO=['PAGE REPLACEMENT','Memory is small. When a needed page is missing, the OS must remove another page to make room.','a small desk and a big library.','Press Next step.'];
function rst0(){clr();T('#alg','3 FRAMES, 12 PAGE REQUESTS')}
const X={rep:()=>{if(si>=0&&!busy)go(si)}};
const STEPS=[
{t:'Small memory',a:'a small desk and a big library.',h:'Press Next step.',f:()=>{clr();return 'Memory has only 3 frames but the program asks for 12 pages in a row. A page that is missing is a PAGE FAULT.'}},
{t:'FIFO',w:9800,a:'throwing out the book that arrived first.',h:'Watch HIT and PAGE FAULT.',f:()=>{play('fifo',n=>'FIFO finished with '+n+' page faults. It may evict a page that is still being used.');return 'FIFO: when memory is full, remove the page that has been there the longest.'}},
{t:'LRU',w:9800,a:'putting away the book you have not touched for longest.',h:'Compare the fault count.',f:()=>{play('lru',n=>'LRU finished with '+n+' page faults. Recently used pages tend to be needed again.');return 'LRU: remove the page that has not been used for the longest time.'}},
{t:'Compare',a:'oldest book or least recently used book?',h:'Click Replay to watch again.',f:()=>{return 'FIFO: '+simR('fifo')[11].f+' faults. LRU: '+simR('lru')[11].f+' faults. Fewer faults means a faster program. LRU is usually better.'}}];
function dots(){for(let i=0;i<STEPS.length;i++)$('#d'+i).setAttribute('color',i<si?'#2e9e6b':i==si?'#f90':'#555')}
function go(i){if(busy)return;si=i;const s=STEPS[i];T('#ttl','Step '+(i+1)+'/'+STEPS.length+': '+s.t);T('#inf',s.f()||'');T('#ana','Think of it like: '+(s.a||''));T('#hnt','Try this: '+(s.h||'Press Next step'));dots()}
const ACT=Object.assign({
 next:()=>{if(si<STEPS.length-1)go(si+1)},
 run:()=>{ACT.rst();const n=()=>{if(si>=STEPS.length-1)return;if(busy){tm.push(setTimeout(n,300));return}go(si+1);tm.push(setTimeout(n,STEPS[si].w||3600))};n()},
 rst:()=>{tm.forEach(clearTimeout);tm=[];busy=0;si=-1;rst0();T('#ttl',INTRO[0]);T('#inf',INTRO[1]);T('#ana',INTRO[2]);T('#hnt',INTRO[3]);dots()}},X);
document.querySelectorAll('.btn,.hit').forEach(b=>b.addEventListener('click',()=>{const f=ACT[b.dataset.a];if(f)f(b.dataset.v)}));
ACT.rst();
</script></body></html>
