<script>
const $=s=>document.querySelector(s),T=(s,v)=>$(s).setAttribute('value',v);
const hx=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(16).padStart(8,'0')};
const pc=n=>n.toString(2).split('1').length-1;
let si=-1,busy=0,tm=[];
const at=(ms,f)=>tm.push(setTimeout(f,ms)),hold=ms=>{busy=1;at(ms,()=>busy=0)};
const vs=(a,v)=>a.forEach(i=>$('#'+i).setAttribute('visible',v));

const RQ=[98,183,37,122,14,124,65,67],HD=50,TXf=t=>-2.8+t*5.6/199,Y0=4.1,DY=.3;
function pathOf(a){if(a=='fcfs')return[HD,...RQ];if(a=='sstf'){const l=RQ.slice(),p=[HD];let c=HD;while(l.length){let b=0;l.forEach((v,i)=>{if(Math.abs(v-c)<Math.abs(l[b]-c))b=i});c=l.splice(b,1)[0];p.push(c)}return p}
 const up=RQ.filter(v=>v>=HD).sort((x,y)=>x-y),dn=RQ.filter(v=>v<HD).sort((x,y)=>y-x);return[HD,...up,199,...dn]}
const totOf=p=>p.slice(1).reduce((s,v,i)=>s+Math.abs(v-p[i]),0);
const NAME={fcfs:'FCFS',sstf:'SSTF',scan:'SCAN'};
function clr(){for(let i=0;i<11;i++){vs(['tp'+i,'ts'+i],false);T('#tl'+i,'')}for(let i=0;i<8;i++)$('#pn'+i).setAttribute('color','#ffd36b');$('#hd').setAttribute('visible',false);T('#tot','')}
function point(P,i,run,tot){const x=TXf(P[i]),y=Y0-DY*i;const tp=$('#tp'+i);tp.setAttribute('position',x+' '+y+' 0');tp.setAttribute('visible',true);$('#tl'+i).setAttribute('position',(x+.25)+' '+y+' 0');T('#tl'+i,String(P[i]));
 if(i){const px=TXf(P[i-1]),py=Y0-DY*(i-1),L=Math.hypot(x-px,y-py),s=$('#ts'+i);s.setAttribute('visible',true);s.setAttribute('width',L);s.setAttribute('position',(x+px)/2+' '+(y+py)/2+' 0');s.setAttribute('rotation','0 0 '+Math.atan2(y-py,x-px)*180/Math.PI)}
 const h=$('#hd');h.setAttribute('visible',true);h.setAttribute('animation__m',{property:'position',to:x+' '+y+' .1',dur:600,easing:'linear'});const k=RQ.indexOf(P[i]);if(k>=0)$('#pn'+k).setAttribute('color','#2e9e6b');T('#tot',NAME[run]+': head moved '+tot+' tracks so far')}
function play(a,msg){clr();const P=pathOf(a);busy=1;let t=0;P.forEach((v,i)=>at(i*700,()=>{if(i)t+=Math.abs(v-P[i-1]);point(P,i,a,t)}));at(P.length*700,()=>{busy=0;T('#inf',msg(totOf(P)))})}
const INTRO=['DISK SCHEDULING','A hard disk head must move to each requested track. Moving is slow, so the order of requests matters.','a delivery driver planning a route.','Press Next step.'];
function rst0(){vs(['pgp'],false);clr();$('#hd').removeAttribute('animation__m')}
const X={rep:()=>{if(si>=0&&!busy)go(si)}};
const STEPS=[
{t:'Disk and requests',a:'a delivery driver with 8 addresses.',h:'Press Next step.',f:()=>{vs(['pgp'],true);const h=$('#hd');h.setAttribute('visible',true);h.setAttribute('position',TXf(HD)+' '+Y0+' .1');return 'The head starts at track 50. Yellow pins are the requested tracks (0 to 199). Time runs downwards in the chart.'}},
{t:'FCFS',w:6600,a:'visiting houses in the order the orders arrived.',h:'Watch the zigzag.',f:()=>{play('fcfs',n=>'FCFS moved the head '+n+' tracks. Fair, but it zigzags a lot.');return 'First Come, First Served: visit the requests in the order they arrived.'}},
{t:'SSTF',w:6600,a:'always driving to the nearest house.',h:'Compare the total.',f:()=>{play('sstf',n=>'SSTF moved '+n+' tracks. Very short, but far requests may wait forever (starvation).');return 'Shortest Seek Time First: always go to the nearest unserved request.'}},
{t:'SCAN (elevator)',w:7400,a:'an elevator sweeping up, then down.',h:'Watch it reach the end.',f:()=>{play('scan',n=>'SCAN moved '+n+' tracks. Fair to everyone: no request waits forever.');return 'SCAN: the head sweeps to one end (199), serving requests on the way, then comes back.'}},
{t:'Compare',a:'choosing the best delivery route.',h:'Click Replay to watch again.',f:()=>{return 'Head movement: FCFS '+totOf(pathOf('fcfs'))+', SSTF '+totOf(pathOf('sstf'))+', SCAN '+totOf(pathOf('scan'))+' tracks. Less movement means a faster disk.'}}];
function dots(){for(let i=0;i<STEPS.length;i++)$('#d'+i).setAttribute('color',i<si?'#2e9e6b':i==si?'#f90':'#555')}
function go(i){if(busy)return;si=i;const s=STEPS[i];T('#ttl','Step '+(i+1)+'/'+STEPS.length+': '+s.t);T('#inf',s.f()||'');T('#ana','Think of it like: '+(s.a||''));T('#hnt','Try this: '+(s.h||'Press Next step'));dots()}
const ACT=Object.assign({
 next:()=>{if(si<STEPS.length-1)go(si+1)},
 run:()=>{ACT.rst();const n=()=>{if(si>=STEPS.length-1)return;if(busy){tm.push(setTimeout(n,300));return}go(si+1);tm.push(setTimeout(n,STEPS[si].w||3600))};n()},
 rst:()=>{tm.forEach(clearTimeout);tm=[];busy=0;si=-1;rst0();T('#ttl',INTRO[0]);T('#inf',INTRO[1]);T('#ana',INTRO[2]);T('#hnt',INTRO[3]);dots()}},X);
document.querySelectorAll('.btn,.hit').forEach(b=>b.addEventListener('click',()=>{const f=ACT[b.dataset.a];if(f)f(b.dataset.v)}));
ACT.rst();
</script></body></html>
