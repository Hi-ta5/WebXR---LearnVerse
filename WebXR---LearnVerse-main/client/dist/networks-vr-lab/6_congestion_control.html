<script>
const $=s=>document.querySelector(s),T=(s,v)=>$(s).setAttribute('value',v);
const hx=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(16).padStart(8,'0')};
const pc=n=>n.toString(2).split('1').length-1;
let si=-1,busy=0,tm=[];

const PAT=[3,2,0,0,1,0,0,2,0,0,1,0];let iv=0,t=0,ex=0,fi=0,lb,tb,ck,aw;
const at=(ms,f)=>tm.push(setTimeout(f,ms));
const stop=()=>{clearInterval(iv);iv=0};
const grp=(a,b,c)=>{$('#g1').setAttribute('visible',a);$('#g2').setAttribute('visible',b);$('#g3').setAttribute('visible',c)};
function fl(a,b,c,t0,dur){const k=fi++%10;at(t0,()=>{const e=$('#fq'+k);e.setAttribute('color',c);e.setAttribute('position',a[0]+' '+a[1]+' .2');e.setAttribute('visible',true);e.setAttribute('animation__f',{property:'position',to:b[0]+' '+b[1]+' .2',dur:dur,easing:'linear'});at(dur+40,()=>e.setAttribute('visible',false))})}
function lvl(n,c){for(let i=0;i<6;i++){const e=$('#cb'+i);e.setAttribute('visible',i<n);e.setAttribute('color',c)}}
function qbar(q){const h=Math.max(.02,1.8*q/8),e=$('#qf');e.setAttribute('height',h);e.setAttribute('position','1.45 '+(2.1+h/2)+' 0')}
function lbTick(){const arr=PAT[t%12]+ex;ex=0;const acc=Math.min(arr,6-lb.l),drop=arr-acc;lb.l+=acc;lb.d+=drop;const out=lb.l>0?1:0;lb.l-=out;lb.o+=out;
 for(let i=0;i<acc;i++)fl([-2.5,3.6],[-.1,3.7],'#3b82c4',i*140,420);for(let i=0;i<drop;i++)fl([-.1,3.8],[1.1,2.4],'#c4423b',i*140,500);if(out)fl([-.1,1.95],[3.0,1.95],'#3b82c4',500,500);
 lvl(lb.l,'#3b82c4');T('#cnt','arrived '+arr+'   in bucket '+lb.l+'   sent out '+lb.o+'   DROPPED '+lb.d)}
function tbTick(){tb.k=Math.min(6,tb.k+1);const arr=PAT[t%12]+ex+tb.w;ex=0;const send=Math.min(arr,tb.k);tb.k-=send;let w=arr-send,drop=0;if(w>6){drop=w-6;w=6}tb.w=w;tb.s+=send;tb.d+=drop;
 for(let i=0;i<send;i++)fl([-2.5,3.6],[3.0,1.95],'#3b82c4',i*160,900);for(let i=0;i<drop;i++)fl([-2.5,3.4],[-1.5,2.2],'#c4423b',i*140,500);fl([-.1,4.2],[-.1,3.7],'#ffd36b',0,400);
 lvl(tb.k,'#ffd36b');T('#cnt','tokens '+tb.k+'   sent '+tb.s+'   waiting '+tb.w+'   dropped '+tb.d)}
function ckTick(ctrl){const r=ck.r;ck.q+=r;let drop=0;if(ck.q>8){drop=ck.q-8;ck.q=8}ck.d+=drop;const sv=Math.min(2,ck.q);ck.q-=sv;
 for(let i=0;i<r;i++)fl([-2.7,3.0],[.2,3.0],'#3b82c4',i*110,450);if(drop)fl([.2,3.6],[.9,2.4],'#c4423b',300,500);for(let i=0;i<sv;i++)fl([.2,3.0],[3.1,3.0],'#3b82c4',500+i*150,500);
 let ch=0;if(ctrl){if(ck.q>=5){fl([.2,3.75],[-2.7,3.75],'#ff3d3d',600,600);ck.r=Math.max(1,Math.floor(ck.r/2));ch=1}else ck.r=Math.min(5,ck.r+1)}
 qbar(ck.q);T('#ckt','sending '+r+'/tick   queue '+ck.q+'/8   dropped '+ck.d+(ch?'   CHOKE sent!':''))}
const SEQ=[1,2,4,8,9,10,11,12,6,7,8,9,10,11,12,6];
function awTick(){if(aw.i>=16){if(++aw.w>3){aw.i=0;aw.w=0;for(let i=0;i<16;i++)$('#ab'+i).setAttribute('visible',false)}return}const i=aw.i++,v=SEQ[i],e=$('#ab'+i),ph=i<4?0:(i==8||i==15)?2:1;e.setAttribute('visible',true);e.setAttribute('height',.22*v);e.setAttribute('position',(-2.7+i*.36)+' '+(1.8+.11*v)+' 0');e.setAttribute('color',['#d9822b','#2e9e6b','#c4423b'][ph]);T('#ph',['SLOW START: window doubles each round','CONGESTION AVOIDANCE: +1 each round','PACKET LOSS: window cut in half'][ph]+'  (window = '+v+')')}
function run(f){stop();t=0;iv=setInterval(()=>{f();t++},900)}
const INTRO=['CONGESTION CONTROL','When too much data enters a network, queues overflow and packets are lost. Congestion control keeps traffic flowing.','a traffic jam and the tools that prevent it.','Press Next step.'];
function rst0(){stop();grp(false,false,false);for(let k=0;k<10;k++)$('#fq'+k).setAttribute('visible',false);ex=0}
const X={burst:()=>{ex+=4;T('#inf','Burst! 4 extra packets arrive on the next tick.')},rep:()=>{if(si>=0){busy=0;go(si)}}};
const STEPS=[
{t:'The problem: a jam',a:'a traffic jam at a toll booth.',h:'Watch the red dropped packets.',f:()=>{grp(false,true,false);ck={r:4,q:0,d:0};T('#ckm','NO CONTROL');qbar(0);run(()=>ckTick(false));return 'The sender sends 4 packets per tick but the router passes only 2. The queue fills and packets are DROPPED.'}},
{t:'Leaky bucket',a:'a bucket with a small hole.',h:'Click Burst! to add packets.',f:()=>{grp(true,false,false);$('#tk').setAttribute('visible',false);lb={l:0,o:0,d:0};T('#mt','LEAKY BUCKET');lvl(0,'#3b82c4');run(lbTick);return 'Leaky bucket: bursts pour in but packets leave at one steady rate. If the bucket is full, extra packets spill and are dropped.'}},
{t:'Token bucket',a:'a bag of tickets you can spend when you like.',h:'Click Burst! and watch tokens.',f:()=>{grp(true,false,false);$('#tk').setAttribute('visible',true);tb={k:3,s:0,w:0,d:0};T('#mt','TOKEN BUCKET');lvl(3,'#ffd36b');run(tbTick);return 'Token bucket: one token arrives each tick. A packet needs a token to leave, so saved tokens allow short bursts.'}},
{t:'Choke packets',a:'a traffic officer waving cars to slow down.',h:'Compare with step 1.',f:()=>{grp(false,true,false);ck={r:4,q:0,d:0};T('#ckm','WITH CHOKE PACKETS');qbar(0);run(()=>ckTick(true));return 'When the queue is long the router sends a red choke packet back. The sender halves its rate, so no more drops.'}},
{t:'TCP window (AIMD)',a:'filling a pool but stopping before it overflows.',h:'Wait for the sawtooth.',f:()=>{grp(false,false,true);aw={i:0,w:0};for(let i=0;i<16;i++)$('#ab'+i).setAttribute('visible',false);run(awTick);return 'TCP grows its window fast (slow start), then adds 1 per round trip, and halves it on loss. The result is a sawtooth.'}}];
function dots(){for(let i=0;i<STEPS.length;i++)$('#d'+i).setAttribute('color',i<si?'#2e9e6b':i==si?'#f90':'#555')}
function go(i){if(busy)return;si=i;const s=STEPS[i];T('#ttl','Step '+(i+1)+'/'+STEPS.length+': '+s.t);T('#inf',s.f()||'');T('#ana','Think of it like: '+(s.a||''));T('#hnt','Try this: '+(s.h||'Press Next step'));dots()}
const ACT=Object.assign({
 next:()=>{if(si<STEPS.length-1)go(si+1)},
 run:()=>{ACT.rst();const n=()=>{if(si>=STEPS.length-1)return;if(busy){tm.push(setTimeout(n,300));return}go(si+1);tm.push(setTimeout(n,STEPS[si].w||3600))};n()},
 rst:()=>{tm.forEach(clearTimeout);tm=[];busy=0;si=-1;rst0();T('#ttl',INTRO[0]);T('#inf',INTRO[1]);T('#ana',INTRO[2]);T('#hnt',INTRO[3]);dots()}},X);
document.querySelectorAll('.btn,.hit').forEach(b=>b.addEventListener('click',()=>{const f=ACT[b.dataset.a];if(f)f(b.dataset.v)}));
ACT.rst();
</script></body></html>
