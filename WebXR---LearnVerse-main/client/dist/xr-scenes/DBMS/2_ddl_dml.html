<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DDL and DML Commands</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script></head><body>
<a-scene cursor="rayOrigin:mouse" raycaster="objects:.btn,.hit" vr-mode-ui="enabled:true">
<a-sky color="#0b1d33"></a-sky><a-circle rotation="-90 0 0" radius="7" color="#12304f"></a-circle>
<a-light type="ambient" intensity=".9"></a-light><a-light type="directional" position="1 4 2" intensity=".6"></a-light>
<a-entity position="0 0 0"><a-entity camera look-controls wasd-controls position="0 1.6 0"></a-entity>
<a-entity laser-controls="hand:right" raycaster="objects:.btn,.hit;far:20"></a-entity></a-entity>
<a-entity position="-1.45 0 -4">
<a-text value="DDL and DML Commands" align="center" position="1.45 3.9 0" width="7.5" color="#ffd36b"></a-text>
<a-plane position="4.5 2.2 -.02" width="3.4" height="3.7" color="#10263f"></a-plane>
<a-text id="i" value="Look at the scene and click any item or button (mouse, or controller trigger in VR)." position="2.95 2.2 0" width="3.1" wrap-count="31" anchor="left" align="left" baseline="center" color="#fff"></a-text>
<a-plane position="-.35 2.45 -.02" width="5.3999999999999995" height="1.9" color="#0e2238"></a-plane><a-text id="tb" value="(table does not exist)" align="left" anchor="left" position="-2.9 2.45 0" width="5.1" wrap-count="56" color="#fff"></a-text>
<a-text  value="DDL" align="center" anchor="center" position="-3.2 1.2 0" width="1" wrap-count="11" color="#cfe3ff"></a-text>
<a-text  value="DML" align="center" anchor="center" position="-3.2 0.6 0" width="1" wrap-count="11" color="#cfe3ff"></a-text>
<a-box class="btn" data-x="C" data-t="DDL: CREATE TABLE STUDENT(id INT PRIMARY KEY, name VARCHAR(30));
Defines the structure (schema). Stored in the data dictionary." position="-2.0 1.2 0" width="1.5" height=".5" depth=".1" color="#2a6db0"><a-text value="CREATE" align="center" position="0 0 .06" width="2.6" color="#fff"></a-text></a-box>
<a-box class="btn" data-x="A" data-t="DDL: ALTER TABLE STUDENT ADD dept VARCHAR(10);
Changes the structure of an existing table." position="-0.35 1.2 0" width="1.5" height=".5" depth=".1" color="#2a6db0"><a-text value="ALTER" align="center" position="0 0 .06" width="2.6" color="#fff"></a-text></a-box>
<a-box class="btn" data-x="D" data-t="DDL: DROP TABLE STUDENT;
Removes the structure AND all its data." position="1.2999999999999998 1.2 0" width="1.5" height=".5" depth=".1" color="#2a6db0"><a-text value="DROP" align="center" position="0 0 .06" width="2.6" color="#fff"></a-text></a-box>
<a-box class="btn" data-x="I" data-t="DML: INSERT INTO STUDENT VALUES(...);
Adds a row. Works on data, not structure. Can be rolled back." position="-2.0 0.6 0" width="1.5" height=".5" depth=".1" color="#2a6db0"><a-text value="INSERT" align="center" position="0 0 .06" width="2.6" color="#fff"></a-text></a-box>
<a-box class="btn" data-x="U" data-t="DML: UPDATE STUDENT SET name=&#x27;UPDATED&#x27; WHERE id=1;
Modifies existing rows." position="-0.35 0.6 0" width="1.5" height=".5" depth=".1" color="#2a6db0"><a-text value="UPDATE" align="center" position="0 0 .06" width="2.6" color="#fff"></a-text></a-box>
<a-box class="btn" data-x="R" data-t="DML: DELETE FROM STUDENT WHERE ...;
Removes rows; the table structure stays." position="1.2999999999999998 0.6 0" width="1.5" height=".5" depth=".1" color="#2a6db0"><a-text value="DELETE" align="center" position="0 0 .06" width="2.6" color="#fff"></a-text></a-box>
</a-entity></a-scene>
<script>
const $=s=>document.querySelector(s),T=(s,v)=>$(s).setAttribute('value',v);
let c=null,r=[],n=0;
function X(k){
 if(k=='C'){c=['id','name'];r=[];n=0}
 else if(!c){T('#i','The table does not exist. Run CREATE (DDL) first.')}
 else if(k=='A'){if(c.length<3){c.push('dept');r.forEach(x=>x.push('CSE'))}}
 else if(k=='D'){c=null;r=[]}
 else if(k=='I'){n++;r.push([n,'Student'+n,'CSE'].slice(0,c.length))}
 else if(k=='U'){if(r[0])r[0][1]='UPDATED'}
 else if(k=='R'){r.pop()}
 T('#tb',c?'STUDENT\n'+c.join(' | ')+'\n------------------------\n'+r.map(x=>x.join(' | ')).join('\n'):'(table does not exist)')}
document.querySelectorAll('.btn,.hit').forEach(b=>b.addEventListener('click',()=>{
 if(b.classList.contains('btn')){document.querySelectorAll('.btn').forEach(x=>x.setAttribute('color','#2a6db0'));b.setAttribute('color','#f90')}
 T('#i',b.dataset.t);if(window.X)X(b.dataset.x||'')}));
</script></body></html>
