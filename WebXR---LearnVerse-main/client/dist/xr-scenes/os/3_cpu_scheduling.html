<script>
const $=s=>document.querySelector(s),T=(s,v)=>$(s).setAttribute('value',v);
const hx=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(16).padStart(8,'0')};
const pc=n=>n.toString(2).split('1').length-1;
let si=-1,busy=0,tm=[];
const at=(ms,f)=>tm.push(setTimeout(f,ms)),hold=ms=>{busy=1;at(ms,()=>busy=0)};
const vs=(a,v)=>a.forEach(i=>$('#'+i).setAttribute('visible',v));

const PR=[['P1',0,6,'#3b82c4'],['P2',1,3,'#2e9e6b'],['P3',2,1,'#d9822b'],['P4',3,2,'#8a5cc4']],GX=-2.7,GS=.45,NAME={fcfs:'FCFS',sjf:'SJF',rr:'RR (q=2)'};let alg=0;
function sim(a){const rem=PR.map(p=>p[2]),ct=[0,0,0,0],arrived=[0,0,0,0],seg=[];let t=0,q=[];
 const arr=()=>PR.forEach((p,i)=>{if(!arrived[i]&&p[1]<=t){arrived[i]=1;q.push(i)}});arr();
 while(ct.some(c=>!c)){if(!q.length){t++;arr();continue}
  if(a=='sjf')q.sort((x,y)=>rem[x]-rem[y]||x-y);
  const i=q.shift(),run=a=='rr'?Math.min(2,rem[i]):rem[i],s=t;
  for(let k=0;k<run;k++){t++;rem[i]--;arr()}
  seg.push({p:i,s,e:t,q:q.slice()});
  if(rem[i]==0)ct[i]=t;else q.push(i)}
 const tat=PR.map((p,i)=>ct[i]-p[1]),wt=tat.map((x,i)=>x-PR[i][2]);
 return{seg,ct,aw:wt.reduce((x,y)=>x+y)/4,at:tat.reduce((x,y)=>x+y)/4}}
function clr(){for(let k=0;k<16;k++)vs(['gb'+k,'gt'+k,'gl'+k],false);for(let j=0;j<4;j++)vs(['qs'+j,'qt'+j],false);T('#cpu','CPU: -');T('#dn','');T('#ge','')}
function reveal(r,k){const s=r.seg[k],w=(s.e-s.s)*GS,x=GX+s.s*GS+w/2;vs(['gb'+k,'gt'+k,'gl'+k],true);const g=$('#gb'+k);g.setAttribute('width',w);g.setAttribute('position',x+' 2.95 0');g.setAttribute('color',PR[s.p][3]);const t=$('#gt'+k);t.setAttribute('position',x+' 2.95 .07');T('#gt'+k,PR[s.p][0]);$('#gl'+k).setAttribute('position',(GX+s.s*GS)+' 2.5 0');T('#gl'+k,String(s.s));
 T('#cpu','CPU: '+PR[s.p][0]);for(let j=0;j<4;j++){const on=j<s.q.length;vs(['qs'+j,'qt'+j],on);if(on){$('#qs'+j).setAttribute('color',PR[s.q[j]][3]);T('#qt'+j,PR[s.q[j]][0])}}
 T('#dn','done: '+PR.filter((p,i)=>r.ct[i]&&r.ct[i]<=s.e).map(p=>p[0]).join(' '));if(k==r.seg.length-1){$('#ge').setAttribute('position',(GX+s.e*GS)+' 2.5 0');T('#ge',String(s.e))}}
function play(a,msg){clr();T('#alg',NAME[a]);const r=sim(a);hold(r.seg.length*900+300);r.seg.forEach((s,k)=>at(k*900,()=>reveal(r,k)));at(r.seg.length*900,()=>T('#inf',msg(r)));return r}
const f2=x=>x.toFixed(2);
const INTRO=['CPU SCHEDULING','Many processes want the CPU but there is only one. The scheduler decides who runs next and for how long.','a single cashier serving a line of customers.','Press Next step.'];
function rst0(){clr();T('#alg','')}
const X={sw:()=>{if(busy)return;alg=(alg+1)%3;const a=['fcfs','sjf','rr'][alg];play(a,r=>NAME[a]+' done. Average waiting time = '+f2(r.aw)+'.')}};
const STEPS=[
{t:'Meet the processes',a:'customers with different shopping sizes.',h:'Press Next step.',f:()=>{clr();return 'Four processes arrive at different times. Burst = how long each needs the CPU. The colored bar below will show who runs when.'}},
{t:'FCFS',w:6200,a:'a plain queue: first in, first served.',h:'Watch the colored bar grow.',f:()=>{play('fcfs',r=>'FCFS done. Average wait = '+f2(r.aw)+'. A long job makes short jobs wait (convoy effect).');return 'First Come, First Served: run the processes in the order they arrived.'}},
{t:'SJF',w:6200,a:'the express lane for small baskets.',h:'Compare the average wait.',f:()=>{play('sjf',r=>'SJF done. Average wait = '+f2(r.aw)+'. Shortest job first gives the lowest wait, but long jobs may starve.');return 'Shortest Job First: when the CPU is free, pick the process with the smallest burst.'}},
{t:'Round Robin',w:7600,a:'everyone gets a 2-minute turn, then back of the line.',h:'Click Switch alg to replay any.',f:()=>{play('rr',r=>'Round Robin done. Average wait = '+f2(r.aw)+'. Fair: every process gets a turn.');return 'Round Robin: each process runs for at most 2 time units, then goes to the back of the queue.'}},
{t:'Compare',a:'choosing the best queue rule for a shop.',h:'Click Switch alg to replay.',f:()=>{const a=sim('fcfs'),b=sim('sjf'),c=sim('rr');return 'Average waiting time: FCFS '+f2(a.aw)+', SJF '+f2(b.aw)+', RR '+f2(c.aw)+'. SJF is best here, RR is fairest.'}}];
function dots(){for(let i=0;i<STEPS.length;i++)$('#d'+i).setAttribute('color',i<si?'#2e9e6b':i==si?'#f90':'#555')}
function go(i){if(busy)return;si=i;const s=STEPS[i];T('#ttl','Step '+(i+1)+'/'+STEPS.length+': '+s.t);T('#inf',s.f()||'');T('#ana','Think of it like: '+(s.a||''));T('#hnt','Try this: '+(s.h||'Press Next step'));dots()}
const ACT=Object.assign({
 next:()=>{if(si<STEPS.length-1)go(si+1)},
 run:()=>{ACT.rst();const n=()=>{if(si>=STEPS.length-1)return;if(busy){tm.push(setTimeout(n,300));return}go(si+1);tm.push(setTimeout(n,STEPS[si].w||3600))};n()},
 rst:()=>{tm.forEach(clearTimeout);tm=[];busy=0;si=-1;rst0();T('#ttl',INTRO[0]);T('#inf',INTRO[1]);T('#ana',INTRO[2]);T('#hnt',INTRO[3]);dots()}},X);
document.querySelectorAll('.btn,.hit').forEach(b=>b.addEventListener('click',()=>{const f=ACT[b.dataset.a];if(f)f(b.dataset.v)}));
ACT.rst();
</script></body></html>
