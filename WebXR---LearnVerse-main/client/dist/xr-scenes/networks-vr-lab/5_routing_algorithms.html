<a-box id="e4" class="hit" data-a="cut" data-v="4" position="0.00 1.90 0" rotation="0 0 0.0" width="2.60" height=".07" depth=".07" color="#9fb4d6"></a-box><a-circle class="hit" data-a="cut" data-v="4" position="0.00 1.90 .05" radius=".2" color="#10263f"></a-circle><a-text id="c4" value="" align="center" anchor="center" baseline="center" position="0.0 1.9 0.08" width="0.40" wrap-count="2" color="#fff"></a-text>
<a-box id="e5" class="hit" data-a="cut" data-v="5" position="1.30 3.00 0" rotation="0 0 -90.0" width="2.20" height=".07" depth=".07" color="#9fb4d6"></a-box><a-circle class="hit" data-a="cut" data-v="5" position="1.30 3.00 .05" radius=".2" color="#10263f"></a-circle><a-text id="c5" value="" align="center" anchor="center" baseline="center" position="1.3 3.0 0.08" width="0.40" wrap-count="2" color="#fff"></a-text>

<a-box id="e7" class="hit" data-a="cut" data-v="7" position="2.00 2.45 0" rotation="0 0 38.2" width="1.78" height=".07" depth=".07" color="#9fb4d6"></a-box><a-circle class="hit" data-a="cut" data-v="7" position="2.00 2.45 .05" radius=".2" color="#10263f"></a-circle><a-text id="c7" value="" align="center" anchor="center" baseline="center" position="2.0 2.45 0.08" width="0.40" wrap-count="2" color="#fff"></a-text>

<a-sphere id="rt2" position="-1.3 1.9 0" radius=".32" color="#555"><a-text value="C" align="center" position="0 0 .34" width=".4" wrap-count="1" color="#fff"></a-text></a-sphere><a-text id="dl2" value="" align="center" anchor="center" baseline="center" position="-1.3 2.45 0" width="0.90" wrap-count="6" color="#ffd36b"></a-text>

<a-sphere id="rt5" position="2.7 3.0 0" radius=".32" color="#555"><a-text value="F" align="center" position="0 0 .34" width=".4" wrap-count="1" color="#fff"></a-text></a-sphere><a-text id="dl5" value="" align="center" anchor="center" baseline="center" position="2.7 3.55 0" width="0.90" wrap-count="6" color="#ffd36b"></a-text>
<a-sphere id="pk" radius=".17" color="#ffd36b" position="-2.6 3 .2" visible="false"></a-sphere><a-entity id="asg" visible="false"><a-plane position="-1.9 3.0 -.1" width="2.8" height="3.6" color="#3b82c4" opacity=".18"></a-plane><a-plane position="2.0 3.0 -.1" width="2.8" height="3.6" color="#d9822b" opacity=".18"></a-plane><a-text value="AS 1 (OSPF inside)" align="center" anchor="center" baseline="center" position="-1.9 1.1 0" width="2.60" wrap-count="20" color="#9cc9ff"></a-text>

<script>
const $=s=>document.querySelector(s),T=(s,v)=>$(s).setAttribute('value',v);
const hx=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(16).padStart(8,'0')};
const pc=n=>n.toString(2).split('1').length-1;
let si=-1,busy=0,tm=[];

const NM='ABCDEF',EG=[[0,1],[0,2],[1,2],[1,3],[2,4],[3,4],[3,5],[4,5]];
const PO=[[-2.6,3.0],[-1.3,4.1],[-1.3,1.9],[1.3,4.1],[1.3,1.9],[2.7,3.0]];
const COSTS=[[2,5,1,4,3,1,3,5],[3,1,2,6,2,4,2,1]];let ci=0,cs=COSTS[0],cut=new Set(),path=[];
const at=(ms,f)=>tm.push(setTimeout(f,ms)),hold=ms=>{busy=1;at(ms,()=>busy=0)};
function dij(){const d=Array(6).fill(1e9),pv=Array(6).fill(-1),vis=Array(6).fill(0),S=[];d[0]=0;for(let n=0;n<6;n++){let u=-1;for(let i=0;i<6;i++)if(!vis[i]&&d[i]<1e9&&(u<0||d[i]<d[u]))u=i;if(u<0)break;vis[u]=1;const notes=[];EG.forEach((e,k)=>{if(cut.has(k))return;const v=e[0]==u?e[1]:e[1]==u?e[0]:-1;if(v<0||vis[v])return;const nd=d[u]+cs[k];if(nd<d[v]){notes.push(NM[v]+'='+nd);d[v]=nd;pv[v]=u}});S.push({u,d:d.slice(),vis:vis.slice(),notes})}
 const p=[];if(d[5]<1e9){let x=5;while(x>=0){p.unshift(x);x=pv[x]}}return{S,p,d}}
function ecol(k,p){if(cut.has(k))return '#c4423b';for(let i=0;i<p.length-1;i++)if((EG[k][0]==p[i]&&EG[k][1]==p[i+1])||(EG[k][1]==p[i]&&EG[k][0]==p[i+1]))return '#ffd36b';return '#9fb4d6'}
function edges(p){for(let k=0;k<8;k++){$('#e'+k).setAttribute('color',ecol(k,p||[]));T('#c'+k,String(cs[k]))}}
function snap(s){for(let i=0;i<6;i++){$('#rt'+i).setAttribute('color',s.vis[i]?(i==s.u?'#d9822b':'#2e9e6b'):s.d[i]<1e9?'#3b82c4':'#555');T('#dl'+i,s.d[i]>=1e9?'inf':String(s.d[i]))}}
function plain(){for(let i=0;i<6;i++){$('#rt'+i).setAttribute('color','#555');T('#dl'+i,'')}}
function travel(p){if(!p.length){T('#inf','No path from A to F! The network is split.');return}const k=$('#pk');k.setAttribute('visible',true);k.setAttribute('position',PO[0][0]+' '+PO[0][1]+' .2');hold(p.length*600+100);p.slice(1).forEach((n,i)=>at(i*600,()=>k.setAttribute('animation__m',{property:'position',to:PO[n][0]+' '+PO[n][1]+' .2',dur:550,easing:'linear'})));at(p.length*600,()=>k.setAttribute('visible',false))}
const pstr=p=>p.map(i=>NM[i]).join(' > ');
function final(){const r=dij();path=r.p;if(r.S.length)snap(r.S[r.S.length-1]);$('#rt0').setAttribute('color','#2e9e6b');edges(path);return r}
function dv(){const I=1e9,D=[],H=[];for(let i=0;i<6;i++){D.push(Array(6).fill(I));D[i][i]=0}const L=[];const f=r=>'A: '+[1,2,3,4,5].filter(j=>D[0][j]<I).map(j=>NM[j]+' '+D[0][j]).join(', ');L.push('Round 0: A knows only itself.');for(let r=1;r<=3;r++){const O=D.map(x=>x.slice());EG.forEach((e,k)=>{[[e[0],e[1]],[e[1],e[0]]].forEach(([a,b])=>{for(let j=0;j<6;j++)if(O[b][j]+cs[k]<D[a][j])D[a][j]=O[b][j]+cs[k]})});L.push('Round '+r+': '+f(r))}return L.join('\n')}
const INTRO=['ROUTING ALGORITHMS','Routers must pick the best path for each packet. The numbers on the links are their costs.','a road map: find the quickest route.','Press Next step. Click a link to cut it.'];
function rst0(){cut.clear();plain();edges([]);$('#pk').setAttribute('visible',false);$('#asg').setAttribute('visible',false);$('#bg').setAttribute('visible',false)}
const X={send:()=>{if(busy)return;const r=final();travel(r.p);T('#inf',r.p.length?'Packet follows '+pstr(r.p)+' (cost '+r.d[5]+').':'No path from A to F!')},
 cost:()=>{ci=1-ci;cs=COSTS[ci];ACT.rst();T('#inf','New link costs loaded. Press Next step.')},
 cut:k=>{k=+k;if(busy)return;if(cut.has(k))cut.delete(k);else cut.add(k);const r=final();travel(r.p);T('#inf',(cut.has(k)?'Link '+NM[EG[k][0]]+'-'+NM[EG[k][1]]+' cut. ':'Link repaired. ')+(r.p.length?'Best path now: '+pstr(r.p)+' (cost '+r.d[5]+').':'A and F are cut off!'))}};
const STEPS=[
{t:'The network map',a:'a road map with travel times.',h:'Click any link to cut it.',f:()=>{plain();edges([]);return 'Six routers (A to F) joined by links. The number on a link is its cost, like delay. Goal: send a packet from A to F cheaply.'}},
{t:'Dijkstra explores',w:9500,a:'ripples spreading out from A.',h:'Watch the numbers above routers.',f:()=>{const r=dij();hold(r.S.length*1400+200);r.S.forEach((s,i)=>at(i*1400,()=>{snap(s);T('#inf','Visit '+NM[s.u]+' (cost '+s.d[s.u]+'). '+(s.notes.length?'Better routes found: '+s.notes.join(', ')+'.':'Nothing to update.'))}));return 'Dijkstra: start at A (0). Repeatedly visit the closest unvisited router and update its neighbours.'}},
{t:'The shortest path',w:4500,a:'following the fastest road on the map.',h:'Click New costs to change the map.',f:()=>{const r=final();travel(r.p);return 'Shortest path: '+pstr(r.p)+' with total cost '+r.d[5]+'. The packet follows the gold path.'}},
{t:'A link fails',w:5000,a:'taking a detour around a closed road.',h:'Click links to cut or repair.',f:()=>{cut.add(3);const r=final();travel(r.p);return 'Link B-D fails (red). Routers run Dijkstra again. New path: '+pstr(r.p)+' with cost '+r.d[5]+'. Routing adapts by itself.'}},
{t:'Distance vector',w:5000,a:'rumours spreading until everyone knows.',h:'Read the rounds in the box.',f:()=>{cut.clear();final();$('#bg').setAttribute('visible',true);T('#brd',dv());return 'Distance vector (RIP): each router tells its neighbours what it knows. After a few rounds A knows every distance.'}},
{t:'Autonomous systems',w:4500,a:'countries with their own roads and treaties.',h:'Click a link to cut it.',f:()=>{$('#bg').setAttribute('visible',false);$('#asg').setAttribute('visible',true);const r=final();travel(r.p);return 'The Internet is split into autonomous systems (AS). Inside an AS routers use OSPF or RIP. Between ASes they use BGP.'}}];
function dots(){for(let i=0;i<STEPS.length;i++)$('#d'+i).setAttribute('color',i<si?'#2e9e6b':i==si?'#f90':'#555')}
function go(i){if(busy)return;si=i;const s=STEPS[i];T('#ttl','Step '+(i+1)+'/'+STEPS.length+': '+s.t);T('#inf',s.f()||'');T('#ana','Think of it like: '+(s.a||''));T('#hnt','Try this: '+(s.h||'Press Next step'));dots()}
const ACT=Object.assign({
 next:()=>{if(si<STEPS.length-1)go(si+1)},
 run:()=>{ACT.rst();const n=()=>{if(si>=STEPS.length-1)return;if(busy){tm.push(setTimeout(n,300));return}go(si+1);tm.push(setTimeout(n,STEPS[si].w||3600))};n()},
 rst:()=>{tm.forEach(clearTimeout);tm=[];busy=0;si=-1;rst0();T('#ttl',INTRO[0]);T('#inf',INTRO[1]);T('#ana',INTRO[2]);T('#hnt',INTRO[3]);dots()}},X);
document.querySelectorAll('.btn,.hit').forEach(b=>b.addEventListener('click',()=>{const f=ACT[b.dataset.a];if(f)f(b.dataset.v)}));
ACT.rst();
</script></body></html>
