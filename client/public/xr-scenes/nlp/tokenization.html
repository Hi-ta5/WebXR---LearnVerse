<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <title>NLP Tokenization VR Lab</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <style>

    body {
      margin: 0;
      overflow: hidden;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      background: #020617;
    }

    .ui {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 320px;
      padding: 20px;
      background: linear-gradient(145deg, rgba(4, 10, 28, 0.96), rgba(9, 20, 45, 0.88));
      border: 1px solid rgba(34, 211, 238, 0.25);
      border-radius: 20px;
      color: white;
      z-index: 999;
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.18), inset 0 0 30px rgba(59, 130, 246, 0.05);
      backdrop-filter: blur(14px);
    }

    .ui h2 {
      color: #00ffff;
      margin-top: 0;
      font-size: 19px;
      letter-spacing: 0.5px;
    }

    .ui p {
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.45;
      margin: 8px 0 12px;
    }

    .ui input {
      width: 100%;
      padding: 12px 13px;
      margin-top: 6px;
      box-sizing: border-box;
      border: 1px solid #164e63;
      border-radius: 10px;
      background: #071426;
      color: white;
      font-size: 13px;
      outline: none;
    }

    .ui input:focus {
      border-color: #00ffff;
      box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.15);
    }

    .ui button {
      width: 100%;
      padding: 11px;
      margin-top: 8px;
      border: none;
      border-radius: 10px;
      background: #00ffff;
      color: #000000;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.25);
    }

    .ui button:hover {
      background: #7fffff;
      transform: translateY(-1px);
      box-shadow: 0 0 22px rgba(0, 240, 255, 0.45);
    }

    .ui button.btn-reset {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #ffffff;
      box-shadow: none;
    }

    .ui button.btn-reset:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #00ffff;
      border-color: #00ffff;
    }

    #status {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(2, 6, 23, 0.65);
      border: 1px solid rgba(34, 211, 238, 0.15);
      color: #86efac;
      font-weight: bold;
      font-size: 12px;
    }

  </style>

</head>


<body>


<!-- ================================= -->
<!-- CONTROL PANEL -->
<!-- ================================= -->

<div class="ui">

  <h2>🔤 TOKENIZATION LAB</h2>

  <p>
    Enter a sentence and split it into tokens.
  </p>

  <input
    id="sentenceInput"
    value="I love learning NLP"
    placeholder="Enter sentence"
  >

  <button onclick="wordTokenization()">
    Word Tokenization
  </button>

  <button onclick="sentenceTokenization()">
    Sentence Tokenization
  </button>

  <button onclick="subwordTokenization()">
    Subword Tokenization
  </button>

  <button class="btn-reset" onclick="resetLab()">
    Reset
  </button>

  <div id="status">
    Ready
  </div>

</div>


<!-- ================================= -->
<!-- VR SCENE -->
<!-- ================================= -->

<a-scene
  background="color:#020617"
  vr-mode-ui="enabled:true">


  <!-- ================================= -->
  <!-- ASSETS -->
  <!-- ================================= -->

  <a-assets>

    <a-asset-item
      id="robotModel"
      src="https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models/2.0/RobotExpressive/glTF/RobotExpressive.gltf">
    </a-asset-item>

  </a-assets>


  <!-- ================================= -->
  <!-- CAMERA -->
  <!-- ================================= -->

  <a-camera
    position="0 4 18">
  </a-camera>


  <!-- ================================= -->
  <!-- LIGHTS -->
  <!-- ================================= -->

  <a-light
    type="ambient"
    intensity="1.5">
  </a-light>

  <a-light
    type="point"
    intensity="3"
    position="0 10 5">
  </a-light>


  <!-- ================================= -->
  <!-- FLOOR -->
  <!-- ================================= -->

  <a-plane

    rotation="-90 0 0"

    width="60"

    height="60"

    color="#111827">

  </a-plane>


  <!-- ================================= -->
  <!-- SKY -->
  <!-- ================================= -->

  <a-sky
    color="#020617">
  </a-sky>


  <!-- ================================= -->
  <!-- TITLE -->
  <!-- ================================= -->

  <a-text

    value="NLP TOKENIZATION LAB"

    position="-6 9 -12"

    scale="3 3 3"

    color="#00ffff">

  </a-text>


  <!-- ================================= -->
  <!-- ROBOT LEFT -->
  <!-- ================================= -->

  <a-gltf-model

    src="#robotModel"

    position="-11 0 -11"

    scale="1 1 1"

    animation="
      property: rotation;
      to: 0 360 0;
      loop: true;
      dur: 16000">

  </a-gltf-model>


  <!-- ================================= -->
  <!-- ROBOT RIGHT -->
  <!-- ================================= -->

  <a-gltf-model

    src="#robotModel"

    position="11 0 -11"

    scale="1 1 1"

    animation="
      property: rotation;
      to: 0 -360 0;
      loop: true;
      dur: 16000">

  </a-gltf-model>


  <!-- ================================= -->
  <!-- ORIGINAL SENTENCE -->
  <!-- ================================= -->

  <a-text

    id="sentenceDisplay"

    value="I love learning NLP"

    position="-5 6 -10"

    scale="1.5 1.5 1.5"

    color="white">

  </a-text>


  <!-- ================================= -->
  <!-- TOKEN CONTAINER -->
  <!-- ================================= -->

  <a-entity
    id="tokenContainer">
  </a-entity>


  <!-- ================================= -->
  <!-- CENTRAL MACHINE -->
  <!-- ================================= -->

  <a-cylinder

    position="0 2 -10"

    radius="2"

    height="2"

    color="#1e3a8a"

    material="
      emissive:#0066ff;
      emissiveIntensity:0.5">

  </a-cylinder>


  <a-text

    value="TOKENIZER"

    position="-1.2 2 -8"

    scale="1.5 1.5 1.5"

    color="white">

  </a-text>


  <!-- ================================= -->
  <!-- INFORMATION PANEL -->
  <!-- ================================= -->

  <a-plane

    position="0 -0.5 -9"

    width="14"

    height="1.8"

    color="#0f172a">

  </a-plane>


  <a-text

    id="explanation"

    value="Tokenization divides text into smaller units called tokens."

    position="-6 -0.3 -8.9"

    scale="1.1 1.1 1.1"

    color="white">

  </a-text>


  <!-- ================================= -->
  <!-- FLOATING PARTICLES -->
  <!-- ================================= -->

  <a-sphere

    position="-7 5 -8"

    radius="0.15"

    color="#00ffff"

    animation="
      property:position;
      dir:alternate;
      to:-7 6 -8;
      dur:2000;
      loop:true">

  </a-sphere>


  <a-sphere

    position="7 6 -8"

    radius="0.15"

    color="#ff00ff"

    animation="
      property:position;
      dir:alternate;
      to:7 5 -8;
      dur:2500;
      loop:true">

  </a-sphere>


</a-scene>


<script>


/* =====================================
   GET SENTENCE
===================================== */

function getSentence() {

  return document
    .getElementById("sentenceInput")
    .value
    .trim();

}


/* =====================================
   CLEAR TOKENS
===================================== */

function clearTokens() {

  document
    .getElementById("tokenContainer")
    .innerHTML = "";

}


/* =====================================
   CREATE TOKEN
===================================== */

function createToken(
  text,
  x,
  y,
  color
) {

  const container =
    document.getElementById(
      "tokenContainer"
    );


  const box =
    document.createElement(
      "a-box"
    );


  box.setAttribute(
    "position",
    `${x} ${y} -9`
  );


  box.setAttribute(
    "width",
    "1.6"
  );


  box.setAttribute(
    "height",
    "1.2"
  );


  box.setAttribute(
    "depth",
    "1"
  );


  box.setAttribute(
    "color",
    color
  );


  box.setAttribute(
    "material",
    "emissive:#00ffff; emissiveIntensity:0.35"
  );


  /* Floating animation */

  box.setAttribute(
    "animation",
    `
      property: position;
      dir: alternate;
      dur: 1200;
      loop: true;
      to: ${x} ${y + 0.3} -9
    `
  );


  /* Token text */

  const label =
    document.createElement(
      "a-text"
    );


  label.setAttribute(
    "value",
    text
  );


  label.setAttribute(
    "align",
    "center"
  );


  label.setAttribute(
    "color",
    "white"
  );


  label.setAttribute(
    "position",
    "0 0 0.6"
  );


  label.setAttribute(
    "scale",
    "1.5 1.5 1.5"
  );


  box.appendChild(label);


  container.appendChild(box);

}


/* =====================================
   WORD TOKENIZATION
===================================== */

function wordTokenization() {

  clearTokens();


  const sentence =
    getSentence();


  const words =
    sentence.split(/\s+/);


  document
    .getElementById(
      "sentenceDisplay"
    )
    .setAttribute(
      "value",
      sentence
    );


  const startX =
    -(words.length - 1) * 0.9;


  words.forEach(
    (word, index) => {

      createToken(

        word,

        startX + index * 1.8,

        4,

        "#2563eb"

      );

    }
  );


  document
    .getElementById("status")
    .innerText =
    "Word Tokenization ✓";


  document
    .getElementById("explanation")
    .setAttribute(
      "value",
      "The sentence has been divided into individual words."
    );

}


/* =====================================
   SENTENCE TOKENIZATION
===================================== */

function sentenceTokenization() {

  clearTokens();


  const sentence =
    getSentence();


  /*
    Split when . ! or ?
  */

  const sentences =
    sentence
      .split(/[.!?]+/)
      .filter(
        item => item.trim() !== ""
      );


  const startX =
    -(sentences.length - 1) * 2;


  sentences.forEach(
    (item, index) => {

      createToken(

        item.trim(),

        startX + index * 4,

        4,

        "#7c3aed"

      );

    }
  );


  document
    .getElementById("status")
    .innerText =
    "Sentence Tokenization ✓";


  document
    .getElementById("explanation")
    .setAttribute(
      "value",
      "The text has been divided into separate sentences."
    );

}


/* =====================================
   SUBWORD TOKENIZATION
===================================== */

function subwordTokenization() {

  clearTokens();


  const sentence =
    getSentence();


  const words =
    sentence.split(/\s+/);


  let tokens = [];


  words.forEach(
    word => {

      /*
        Simple educational
        subword demonstration.
      */

      if(word.length <= 4) {

        tokens.push(word);

      } else {

        tokens.push(
          word.substring(0,3)
        );

        tokens.push(
          "##" +
          word.substring(3)
        );

      }

    }
  );


  const startX =
    -(tokens.length - 1) * 0.9;


  tokens.forEach(
    (token, index) => {

      createToken(

        token,

        startX + index * 1.8,

        4,

        "#db2777"

      );

    }
  );


  document
    .getElementById("status")
    .innerText =
    "Subword Tokenization ✓";


  document
    .getElementById("explanation")
    .setAttribute(
      "value",
      "Words can be divided into smaller pieces called subword tokens."
    );

}


/* =====================================
   RESET
===================================== */

function resetLab() {

  clearTokens();


  document
    .getElementById("sentenceInput")
    .value =
    "I love learning NLP";


  document
    .getElementById("sentenceDisplay")
    .setAttribute(
      "value",
      "I love learning NLP"
    );


  document
    .getElementById("status")
    .innerText =
    "Ready";


  document
    .getElementById("explanation")
    .setAttribute(
      "value",
      "Tokenization divides text into smaller units called tokens."
    );

}

</script>

</body>

</html>
