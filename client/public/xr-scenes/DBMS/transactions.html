<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Transactions VR Lab</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    overflow:hidden;
    background:#020617;
}

/* ==============================
   CONTROL PANEL
============================== */

.panel{

    position:absolute;
    z-index:20;

    top:18px;
    left:18px;

    width:330px;

    padding:20px;

    background:rgba(2,6,23,.95);

    color:white;

    border-radius:18px;

    border:1px solid #facc15;

    box-shadow:
        0 0 25px rgba(250,204,21,.2),
        inset 0 0 20px rgba(250,204,21,.04);

    backdrop-filter:blur(10px);
}

.panel h2{
    margin:0 0 5px;
    color:#facc15;
}

.subtitle{
    color:#94a3b8;
    font-size:13px;
    margin-bottom:14px;
}

#info{

    min-height:78px;

    padding:12px;

    background:#0f172a;

    border-radius:10px;

    font-size:14px;

    line-height:1.5;
}

button{

    width:100%;

    padding:11px;

    margin-top:7px;

    border:none;

    border-radius:9px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
    filter:brightness(1.15);
}

.acidBtn{
    background:#facc15;
    color:#020617;
}

.runBtn{
    background:#22c55e;
    color:white;
}

.rollbackBtn{
    background:#ef4444;
    color:white;
}

.resetBtn{
    background:#7c3aed;
    color:white;
}

/* ==============================
   STATUS
============================== */

.statusBox{

    margin-top:12px;

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:7px;
}

.stat{

    background:#0f172a;

    padding:9px;

    border-radius:9px;

    text-align:center;
}

.stat span{

    display:block;

    color:#94a3b8;

    font-size:11px;
}

.stat strong{

    display:block;

    color:#facc15;

    margin-top:3px;

}

/* ==============================
   NAVIGATION
============================== */

.navigation{

    position:absolute;

    z-index:20;

    top:18px;
    right:18px;

    display:flex;

    gap:7px;
}

.navigation button{

    width:auto;

    margin:0;

    padding:9px 14px;

    background:#1e293b;

    color:white;

    border:1px solid #475569;
}

/* ==============================
   LEGEND
============================== */

.legend{

    position:absolute;

    z-index:20;

    right:18px;

    bottom:18px;

    padding:12px 15px;

    background:rgba(2,6,23,.9);

    color:white;

    border-radius:12px;

    border:1px solid #334155;

    font-size:12px;
}

.legend div{
    margin:5px 0;
}

.dot{

    display:inline-block;

    width:10px;
    height:10px;

    border-radius:50%;

    margin-right:6px;
}

.yellow{
    background:#facc15;
}

.green{
    background:#22c55e;
}

.red{
    background:#ef4444;
}

.blue{
    background:#06b6d4;
}

/* ==============================
   MOBILE
============================== */

@media(max-width:700px){

    .panel{

        width:280px;

        max-height:90vh;

        overflow:auto;
    }

    .navigation{
        display:none;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     CONTROL PANEL
===================================================== -->

<div class="panel">

    <h2>💳 Database Transactions</h2>

    <div class="subtitle">
        Explore ACID properties and watch a database transaction execute step by step.
    </div>


    <div id="info">

        <b>Welcome!</b><br><br>

        Click an ACID property to learn how it protects database transactions.

    </div>


    <button
        class="acidBtn"
        onclick="showACID('Atomicity')">

        ⚛ Atomicity

    </button>


    <button
        class="acidBtn"
        onclick="showACID('Consistency')">

        ✓ Consistency

    </button>


    <button
        class="acidBtn"
        onclick="showACID('Isolation')">

        🔒 Isolation

    </button>


    <button
        class="acidBtn"
        onclick="showACID('Durability')">

        💾 Durability

    </button>


    <button
        class="runBtn"
        onclick="runTransaction()">

        ▶ Run Successful Transaction

    </button>


    <button
        class="rollbackBtn"
        onclick="runRollback()">

        ✕ Simulate Failure / Rollback

    </button>


    <button
        class="resetBtn"
        onclick="resetLab()">

        ↻ Reset Lab

    </button>


    <div class="statusBox">

        <div class="stat">

            <span>Current Step</span>

            <strong id="step">READY</strong>

        </div>


        <div class="stat">

            <span>Transaction</span>

            <strong id="transactionState">IDLE</strong>

        </div>

    </div>

</div>


<!-- =====================================================
     NAVIGATION
===================================================== -->

<div class="navigation">

    <button onclick="goHome()">🏠 Home</button>

    <button onclick="goBack()">← Back</button>

    <button onclick="goNext()">Next →</button>

</div>


<!-- =====================================================
     LEGEND
===================================================== -->

<div class="legend">

    <div>
        <span class="dot yellow"></span>
        Transaction Step
    </div>

    <div>
        <span class="dot blue"></span>
        Database Operation
    </div>

    <div>
        <span class="dot green"></span>
        Successful
    </div>

    <div>
        <span class="dot red"></span>
        Rollback / Failure
    </div>

</div>


<!-- =====================================================
     A-FRAME SCENE
===================================================== -->

<a-scene
    background="color:#020617"
    renderer="antialias:true"
    cursor="rayOrigin:mouse"
    raycaster="objects:.clickable">


    <!-- CAMERA -->

    <a-camera position="0 3.2 14">

        <a-cursor
            color="#facc15"
            fuse="false">
        </a-cursor>

    </a-camera>


    <!-- LIGHTING -->

    <a-light
        type="ambient"
        intensity="1.5">
    </a-light>


    <a-light
        type="point"
        position="0 8 4"
        intensity="2.5"
        color="#facc15">
    </a-light>


    <a-light
        type="point"
        position="-7 5 -4"
        intensity="1.5"
        color="#8b5cf6">
    </a-light>


    <!-- FLOOR -->

    <a-plane
        rotation="-90 0 0"
        width="40"
        height="40"
        color="#0f172a">
    </a-plane>


    <!-- GRID -->

    <a-plane
        rotation="-90 0 0"
        position="0 .01 -5"
        width="30"
        height="30"
        material="
            color:#111827;
            wireframe:true;
            transparent:true;
            opacity:.7
        ">
    </a-plane>


    <a-sky color="#020617"></a-sky>


    <!-- =================================================
         TITLE
    ================================================= -->

    <a-text
        value="DATABASE TRANSACTIONS"
        position="-4.3 7.3 -9"
        color="#facc15"
        scale="2 2 2">
    </a-text>


    <a-text
        value="ACID Properties + Transaction Execution"
        position="-3.5 6.75 -9"
        color="#94a3b8"
        scale=".8 .8 .8">
    </a-text>


    <!-- =================================================
         TRANSACTION FLOW LABEL
    ================================================= -->

    <a-text
        value="TRANSACTION FLOW"
        position="-1.6 5.3 -8"
        color="#e2e8f0"
        scale="1.2 1.2 1.2">
    </a-text>


    <!-- =================================================
         BEGIN
    ================================================= -->

    <a-box
        id="beginBox"
        class="clickable"
        position="-6 3 -8"
        width="2"
        height="2"
        depth="1"
        color="#8b5cf6"
        animation__hover="
            property:scale;
            to:1.12 1.12 1.12;
            startEvents:mouseenter;
            dur:150
        "
        animation__leave="
            property:scale;
            to:1 1 1;
            startEvents:mouseleave;
            dur:150
        "
        onclick="showStep('BEGIN')">

        <a-text
            value="BEGIN"
            align="center"
            position="0 0 .51"
            color="white"
            width="4">
        </a-text>

    </a-box>


    <!-- ARROW -->

    <a-cylinder
        id="arrow1"
        position="-3.5 3 -8"
        radius=".1"
        height="2.5"
        rotation="0 0 90"
        color="#475569">
    </a-cylinder>


    <!-- =================================================
         UPDATE
    ================================================= -->

    <a-box
        id="updateBox"
        class="clickable"
        position="0 3 -8"
        width="2"
        height="2"
        depth="1"
        color="#06b6d4"
        animation__hover="
            property:scale;
            to:1.12 1.12 1.12;
            startEvents:mouseenter;
            dur:150
        "
        animation__leave="
            property:scale;
            to:1 1 1;
            startEvents:mouseleave;
            dur:150
        "
        onclick="showStep('UPDATE')">

        <a-text
            value="UPDATE"
            align="center"
            position="0 0 .51"
            color="white"
            width="4">
        </a-text>

    </a-box>


    <!-- ARROW -->

    <a-cylinder
        id="arrow2"
        position="3 3 -8"
        radius=".1"
        height="2.5"
        rotation="0 0 90"
        color="#475569">
    </a-cylinder>


    <!-- =================================================
         COMMIT
    ================================================= -->

    <a-box
        id="commitBox"
        class="clickable"
        position="6 3 -8"
        width="2"
        height="2"
        depth="1"
        color="#22c55e"
        animation__hover="
            property:scale;
            to:1.12 1.12 1.12;
            startEvents:mouseenter;
            dur:150
        "
        animation__leave="
            property:scale;
            to:1 1 1;
            startEvents:mouseleave;
            dur:150
        "
        onclick="showStep('COMMIT')">

        <a-text
            value="COMMIT"
            align="center"
            position="0 0 .51"
            color="white"
            width="4">
        </a-text>

    </a-box>


    <!-- =================================================
         ACID SECTION
    ================================================= -->

    <a-text
        value="ACID PROPERTIES"
        position="-4.2 7 -7"
        color="#facc15"
        scale="1.1 1.1 1.1">
    </a-text>


    <!-- ATOMICITY -->

    <a-sphere
        id="atomicity"
        class="clickable"
        position="-4 6 -8"
        radius="1"
        color="#ef4444"
        animation__hover="
            property:scale;
            to:1.18 1.18 1.18;
            startEvents:mouseenter;
            dur:150
        "
        animation__leave="
            property:scale;
            to:1 1 1;
            startEvents:mouseleave;
            dur:150
        "
        onclick="showACID('Atomicity')">

        <a-text
            value="A"
            align="center"
            position="0 0 .91"
            color="white"
            width="5">
        </a-text>

    </a-sphere>


    <a-text
        value="Atomicity"
        position="-4.65 4.75 -8"
        color="#fca5a5"
        width="4">
    </a-text>


    <!-- CONSISTENCY -->

    <a-sphere
        id="consistency"
        class="clickable"
        position="-1.3 6 -8"
        radius="1"
        color="#f97316"
        animation__hover="
            property:scale;
            to:1.18 1.18 1.18;
            startEvents:mouseenter;
            dur:150
        "
        animation__leave="
            property:scale;
            to:1 1 1;
            startEvents:mouseleave;
            dur:150
        "
        onclick="showACID('Consistency')">

        <a-text
            value="C"
            align="center"
            position="0 0 .91"
            color="white"
            width="5">
        </a-text>

    </a-sphere>


    <a-text
        value="Consistency"
        position="-2.1 4.75 -8"
        color="#fdba74"
        width="4">
    </a-text>


    <!-- ISOLATION -->

    <a-sphere
        id="isolation"
        class="clickable"
        position="1.5 6 -8"
        radius="1"
        color="#3b82f6"
        animation__hover="
            property:scale;
            to:1.18 1.18 1.18;
            startEvents:mouseenter;
            dur:150
        "
        animation__leave="
            property:scale;
            to:1 1 1;
            startEvents:mouseleave;
            dur:150
        "
        onclick="showACID('Isolation')">

        <a-text
            value="I"
            align="center"
            position="0 0 .91"
            color="white"
            width="5">
        </a-text>

    </a-sphere>


    <a-text
        value="Isolation"
        position=".9 4.75 -8"
        color="#93c5fd"
        width="4">
    </a-text>


    <!-- DURABILITY -->

    <a-sphere
        id="durability"
        class="clickable"
        position="4.3 6 -8"
        radius="1"
        color="#22c55e"
        animation__hover="
            property:scale;
            to:1.18 1.18 1.18;
            startEvents:mouseenter;
            dur:150
        "
        animation__leave="
            property:scale;
            to:1 1 1;
            startEvents:mouseleave;
            dur:150
        "
        onclick="showACID('Durability')">

        <a-text
            value="D"
            align="center"
            position="0 0 .91"
            color="white"
            width="5">
        </a-text>

    </a-sphere>


    <a-text
        value="Durability"
        position="3.75 4.75 -8"
        color="#86efac"
        width="4">
    </a-text>


    <!-- =================================================
         STATUS
    ================================================= -->

    <a-text
        id="status"
        value="TRANSACTION READY"
        position="-3.3 1.3 -8"
        color="#facc15"
        scale="1.4 1.4 1.4">
    </a-text>


    <a-text
        id="description"
        value="Click RUN TRANSACTION to begin"
        position="-2.8 .8 -8"
        color="#94a3b8"
        scale=".7 .7 .7">
    </a-text>


    <!-- DATABASE -->

    <a-box
        id="database"
        position="0 -0.2 -8"
        width="5"
        height=".5"
        depth="1.5"
        color="#1e293b">

        <a-text
            value="DATABASE"
            align="center"
            position="0 0 .8"
            color="#94a3b8"
            width="5">
        </a-text>

    </a-box>


</a-scene>


<script>

/* =====================================================
   VARIABLES
===================================================== */

let running = false;


/* =====================================================
   INFORMATION FUNCTION
===================================================== */

function setInfo(title,text){

    document.getElementById("info").innerHTML =
        "<b>" + title + "</b><br><br>" + text;

}


/* =====================================================
   ACID EXPLANATION
===================================================== */

function showACID(type){

    const data = {

        Atomicity:
        "A transaction follows an <b>all-or-nothing</b> rule.<br><br>" +
        "If every operation succeeds, the transaction is committed. " +
        "If something fails, the changes are rolled back.",

        Consistency:
        "The database must move from one <b>valid state</b> to another valid state.<br><br>" +
        "Database constraints and rules must remain satisfied after the transaction.",

        Isolation:
        "Multiple transactions can execute at the same time without incorrectly interfering with each other.<br><br>" +
        "Each transaction behaves as though it is executing independently.",

        Durability:
        "Once a transaction is <b>committed</b>, its changes are permanently stored.<br><br>" +
        "Even if the system crashes afterwards, committed data should not disappear."

    };

    setInfo(
        "📚 " + type,
        data[type]
    );


    const element =
        document.getElementById(type.toLowerCase());

    if(element){

        element.setAttribute(
            "animation__select",
            "property:scale;to:1.35 1.35 1.35;dur:250;dir:alternate;loop:3"
        );

        setTimeout(()=>{

            element.removeAttribute("animation__select");

        },1800);

    }

}


/* =====================================================
   TRANSACTION STEP INFORMATION
===================================================== */

function showStep(step){

    const messages = {

        BEGIN:
        "The transaction has started. The database is now preparing to perform the requested operations.",

        UPDATE:
        "The database is modifying data. These changes are temporary until the transaction is committed.",

        COMMIT:
        "The transaction has completed successfully. The changes are now permanently committed."

    };

    setInfo(
        "▶ " + step,
        messages[step]
    );

}


/* =====================================================
   RUN TRANSACTION
===================================================== */

async function runTransaction(){

    if(running) return;

    running = true;

    resetVisuals();

    document
        .getElementById("transactionState")
        .innerText = "RUNNING";


    /* BEGIN */

    await transactionStep(
        "BEGIN",
        "beginBox",
        "#facc15",
        "Transaction started"
    );


    /* UPDATE */

    await transactionStep(
        "UPDATE",
        "updateBox",
        "#facc15",
        "Database is updating records"
    );


    /* COMMIT */

    await transactionStep(
        "COMMIT",
        "commitBox",
        "#22c55e",
        "Changes committed successfully"
    );


    document
        .getElementById("transactionState")
        .innerText = "COMMITTED";

    document
        .getElementById("step")
        .innerText = "DONE";


    document
        .getElementById("status")
        .setAttribute(
            "value",
            "✓ TRANSACTION COMMITTED"
        );


    document
        .getElementById("description")
        .setAttribute(
            "value",
            "BEGIN → UPDATE → COMMIT"
        );


    setInfo(
        "✅ Transaction Successful",
        "All operations completed successfully and the changes were committed to the database.<br><br>" +
        "<b>Atomicity:</b> All operations succeeded.<br>" +
        "<b>Consistency:</b> Database rules were maintained.<br>" +
        "<b>Isolation:</b> Operations were treated as one transaction.<br>" +
        "<b>Durability:</b> The committed changes are permanent."
    );


    running = false;

}


/* =====================================================
   TRANSACTION STEP
===================================================== */

function transactionStep(
    name,
    elementId,
    activeColor,
    description
){

    return new Promise(resolve=>{

        const element =
            document.getElementById(elementId);

        document
            .getElementById("step")
            .innerText = name;

        document
            .getElementById("status")
            .setAttribute(
                "value",
                "▶ " + name
            );

        document
            .getElementById("description")
            .setAttribute(
                "value",
                description
            );

        element.setAttribute(
            "color",
            activeColor
        );

        element.setAttribute(
            "animation__active",
            "property:scale;to:1.25 1.25 1.25;dur:300;dir:alternate;loop:3"
        );

        setInfo(
            "▶ " + name,
            description
        );

        setTimeout(()=>{

            element.removeAttribute(
                "animation__active"
            );

            resolve();

        },1800);

    });

}


/* =====================================================
   ROLLBACK SIMULATION
===================================================== */

async function runRollback(){

    if(running) return;

    running = true;

    resetVisuals();


    document
        .getElementById("transactionState")
        .innerText = "RUNNING";


    /* BEGIN */

    await transactionStep(
        "BEGIN",
        "beginBox",
        "#facc15",
        "Transaction started."
    );


    /* UPDATE */

    await transactionStep(
        "UPDATE",
        "updateBox",
        "#facc15",
        "Database is modifying the data..."
    );


    /* FAILURE */

    document
        .getElementById("status")
        .setAttribute(
            "value",
            "⚠ ERROR DETECTED"
        );

    document
        .getElementById("step")
        .innerText = "ERROR";


    document
        .getElementById("transactionState")
        .innerText = "FAILED";


    document
        .getElementById("updateBox")
        .setAttribute(
            "color",
            "#ef4444"
        );


    setInfo(
        "❌ Transaction Failed",
        "An error occurred during the UPDATE operation.<br><br>" +
        "Because of <b>Atomicity</b>, the database must not keep a partially completed transaction."
    );


    await wait(1500);


    /* ROLLBACK */

    document
        .getElementById("status")
        .setAttribute(
            "value",
            "↩ ROLLING BACK"
        );

    document
        .getElementById("step")
        .innerText = "ROLLBACK";


    setInfo(
        "↩ Rollback",
        "The database is undoing the changes made by the failed transaction."
    );


    await wait(1600);


    document
        .getElementById("status")
        .setAttribute(
            "value",
            "✓ ROLLBACK COMPLETE"
        );


    document
        .getElementById("transactionState")
        .innerText = "ROLLED BACK";


    document
        .getElementById("step")
        .innerText = "DONE";


    setInfo(
        "↩ Transaction Rolled Back",
        "The incomplete changes were removed. The database returns to its previous valid state.<br><br>" +
        "This demonstrates the <b>Atomicity</b> property of ACID."
    );


    running = false;

}


/* =====================================================
   RESET
===================================================== */

function resetLab(){

    running = false;

    resetVisuals();

    document
        .getElementById("step")
        .innerText = "READY";

    document
        .getElementById("transactionState")
        .innerText = "IDLE";

    document
        .getElementById("status")
        .setAttribute(
            "value",
            "TRANSACTION READY"
        );

    document
        .getElementById("description")
        .setAttribute(
            "value",
            "Click RUN TRANSACTION to begin"
        );

    setInfo(
        "Welcome!",
        "Click an ACID property to learn how it protects database transactions."
    );

}


/* =====================================================
   RESET VISUALS
===================================================== */

function resetVisuals(){

    document
        .getElementById("beginBox")
        .setAttribute(
            "color",
            "#8b5cf6"
        );

    document
        .getElementById("updateBox")
        .setAttribute(
            "color",
            "#06b6d4"
        );

    document
        .getElementById("commitBox")
        .setAttribute(
            "color",
            "#22c55e"
        );

}


/* =====================================================
   WAIT
===================================================== */

function wait(ms){

    return new Promise(
        resolve => setTimeout(resolve,ms)
    );

}


/* =====================================================
   NAVIGATION
===================================================== */

function goHome(){

    window.location.href = "dbms.html";

}


function goBack(){

    window.history.back();

}


function goNext(){

    /*
       Change this to your next DBMS HTML file.
    */

    window.location.href = "normalization.html";

}

</script>

</body>

</html>
